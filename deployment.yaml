
apiVersion: apps/v1

kind: Deployment

metadata:
  name: oltrs-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: oltrs

  template:
    metadata:
      labels:
        app: oltrs

    spec:
      containers:
        - name: oltrs-container
          image: akshara0612/oltrs:latest
          ports:
            - containerPort: 8080